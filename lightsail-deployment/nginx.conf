# ALLOWLIST-BASED CONFIGURATION
# Default: Deny all API requests
# Only explicitly allowed endpoints below will work
# This ensures new APIs are blocked by default

server {
    listen 80;
    client_max_body_size 50M;

    # ==========================================
    # READ-ONLY SECURITY MODEL
    # ==========================================
    # ALLOWED: All GET/HEAD/OPTIONS requests (read operations)
    # ALLOWED: POST to search/list/get operations
    # BLOCKED: POST/PUT/DELETE/PATCH to write operations
    # ==========================================

    # Block write operations by endpoint pattern
    # Comprehensive list based on MLflow server analysis covering:
    # - Experiments, runs, models, datasets, traces, assessments, webhooks, etc.
    location ~ ^/(api|ajax-api)/[^/]+/mlflow/.*(create|update|delete|set-|log-|restore|rename|transition|finalize|register|cancel|submit|upsert|upload|link-|bind) {
        return 403 '{"error_code": "PERMISSION_DENIED", "message": "Write operations are not allowed in demo mode."}';
        add_header Content-Type application/json;
    }

    # Block POST/PUT/DELETE/PATCH to /records (writing dataset records)
    # GET is allowed for reading dataset records
    location ~ ^/(api|ajax-api)/[^/]+/mlflow/datasets/.*/records$ {
        if ($request_method ~ ^(POST|PUT|DELETE|PATCH)$) {
            return 403 '{"error_code": "PERMISSION_DENIED", "message": "Write operations are not allowed in demo mode."}';
        }
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block POST/PUT/DELETE/PATCH to /assessments (creating/updating assessments)
    # GET is allowed for reading assessments
    location ~ ^/(api|ajax-api)/[^/]+/mlflow/traces/.*/assessments$ {
        if ($request_method ~ ^(POST|PUT|DELETE|PATCH)$) {
            return 403 '{"error_code": "PERMISSION_DENIED", "message": "Write operations are not allowed in demo mode."}';
        }
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block artifact uploads (all methods)
    location ~ ^/mlflow-artifacts/artifacts/ {
        return 403 '{"error_code": "PERMISSION_DENIED", "message": "Artifact uploads are not allowed in demo mode."}';
        add_header Content-Type application/json;
    }

    # Block OpenTelemetry trace export
    location = /v1/traces {
        return 403 '{"error_code": "PERMISSION_DENIED", "message": "Trace export is not allowed in demo mode."}';
        add_header Content-Type application/json;
    }

    # Block gateway LLM invocations
    location ~ ^/gateway/.*/invocations$ {
        return 403 '{"error_code": "PERMISSION_DENIED", "message": "Gateway invocations are not allowed in demo mode."}';
        add_header Content-Type application/json;
    }

    # Block job operations
    location ~ ^/jobs/(submit|cancel) {
        return 403 '{"error_code": "PERMISSION_DENIED", "message": "Job operations are not allowed in demo mode."}';
        add_header Content-Type application/json;
    }

    # Block AI assistant operations
    location ~ ^/assistant/(chat|feedback) {
        return 403 '{"error_code": "PERMISSION_DENIED", "message": "AI assistant operations are not allowed in demo mode."}';
        add_header Content-Type application/json;
    }

    # Block demo data generation (already pre-populated at startup)
    location = /ajax-api/3.0/mlflow/demo/generate {
        return 403 '{"error_code": "PERMISSION_DENIED", "message": "Demo generation is not allowed in demo mode."}';
        add_header Content-Type application/json;
    }

    # ==========================================
    # ALLOW: All other API endpoints
    # ==========================================
    # This catch-all allows:
    # - GET/HEAD/OPTIONS: Always allowed (read operations)
    # - POST: Allowed for search/list/get operations (write ops blocked above)
    # - PUT/DELETE/PATCH: Blocked (write methods)
    location ~ ^/(api|ajax-api)/ {
        limit_except GET HEAD OPTIONS POST {
            deny all;
        }
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GraphQL endpoint (block mutations, allow queries)
    location = /graphql {
        limit_except GET HEAD OPTIONS POST {
            deny all;
        }
        # Note: GraphQL mutations via POST are harder to block at nginx level
        # Consider implementing GraphQL-level auth if mutations are a concern
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location = /health {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================
    # ALLOW: UI static assets (GET only)
    # ==========================================

    # Serve UI - only GET/HEAD/OPTIONS
    location / {
        limit_except GET HEAD OPTIONS {
            deny all;
        }
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
