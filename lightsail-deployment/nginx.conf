# ALLOWLIST-BASED CONFIGURATION
# Default: Deny all API requests
# Only explicitly allowed endpoints below will work
# This ensures new APIs are blocked by default

server {
    listen 80;
    client_max_body_size 50M;

    # ==========================================
    # ALLOW: All read operations on API endpoints
    # ==========================================

    # Block write operations (create, update, delete, log, set, etc.)
    # These patterns match common write operation endpoints
    location ~ ^/(api|ajax-api)/[^/]+/mlflow/.*(create|update|delete|set-|log-|restore|rename|transition) {
        return 403 '{"error_code": "PERMISSION_DENIED", "message": "Write operations are not allowed in demo mode."}';
        add_header Content-Type application/json;
    }

    # Allow all /api/ and /ajax-api/ read operations
    # Permits: GET, HEAD, OPTIONS (always safe)
    # Permits: POST for search/list/get operations
    location ~ ^/(api|ajax-api)/ {
        # Block PUT, DELETE, PATCH (write methods)
        limit_except GET HEAD OPTIONS POST {
            deny all;
        }
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GraphQL endpoint (used by UI for read operations)
    location = /graphql {
        limit_except GET HEAD OPTIONS POST {
            deny all;
        }
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location = /health {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================
    # ALLOW: UI static assets (GET only)
    # ==========================================

    # Serve UI - only GET/HEAD/OPTIONS
    location / {
        limit_except GET HEAD OPTIONS {
            deny all;
        }
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
